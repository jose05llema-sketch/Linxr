name: Build Linxr APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Linxr VM and QEMU assets
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/vm

          gh release download qemu-android-linxr-1 \
            --repo "${{ github.repository }}" \
            --pattern "libqemu.so" \
            --dir android/app/src/main/jniLibs/arm64-v8a

          gh release download qemu-android-linxr-1 \
            --repo "${{ github.repository }}" \
            --pattern "libqemu_img.so" \
            --dir android/app/src/main/jniLibs/arm64-v8a

          gh release download qemu-android-linxr-1 \
            --repo "${{ github.repository }}" \
            --pattern "base.qcow2.gz" \
            --dir android/app/src/main/assets/vm

          gh release download qemu-android-linxr-1 \
            --repo "${{ github.repository }}" \
            --pattern "vmlinuz-virt" \
            --dir android/app/src/main/assets/vm

          gh release download qemu-android-linxr-1 \
            --repo "${{ github.repository }}" \
            --pattern "initramfs-virt" \
            --dir android/app/src/main/assets/vm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: linxr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
