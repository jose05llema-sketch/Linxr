name: Build Linxr APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Enable Android SDK
        run: |
          flutter --version
          flutter config --android-sdk $ANDROID_HOME
          flutter doctor

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Build APK
        run: |
          chmod +x scripts/build_apk.sh
          bash scripts/build_apk.sh debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linxr-debug-apk
          path: build/linxr-debug.apk